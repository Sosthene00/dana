[package]
name = "rust_lib_danawallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
spdk-wallet = { git = "https://github.com/Sosthene00/spdk", rev = "ed4b99581e6092200689d7e94fdfb94c251aef2e" }
frigate-scanner = { package = "frigate", git = "https://github.com/Sosthene00/spdk", rev = "ed4b99581e6092200689d7e94fdfb94c251aef2e" }
lazy_static = "1.4"
anyhow = "1.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
once_cell = "1.18.0"
bip39 = { version = "2.0.0", features = ["rand"] }
serde_with = "3.6.0"
log = "0.4.20"
simplelog = { version = "0.12.1", default-features = false, features = [
  "local-offset",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pushtx = "0.4.0"
futures = "0.3"
async-trait = "0.1"
rand = "0.9.0"
base64 = "0.22.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# ISS-001 fix: override esc (pinned transitively by spdk) with our fork that accepts
# Frigate 1.4.1's header-notification params object ({"header":{...}}) in addition to
# the standard seq shape. Without this, every block notification kills the connection.
# Upstream PR pending; drop this stanza once bitcoindevkit/electrum_streaming_client
# merges a fix containing it.
[patch."https://github.com/bitcoindevkit/electrum_streaming_client"]
electrum_streaming_client = { git = "https://github.com/still-gleam/electrum_streaming_client", branch = "iss001-frigate-header-params" }
